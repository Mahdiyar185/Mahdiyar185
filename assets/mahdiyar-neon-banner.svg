<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-label="Mahdiyar Namazifar — QA Engineer, Playwright Automation and UI/UX Designer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050914"/>
    <stop offset="42%" stop-color="#08162F"/>
    <stop offset="72%" stop-color="#11104A"/>
    <stop offset="100%" stop-color="#210B3C"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="34%" stop-color="#3B82F6"/>
    <stop offset="67%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#D946EF"/>
  </linearGradient>
  <linearGradient id="neon2" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#0EA5E9"/>
    <stop offset="50%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#EC4899"/>
  </linearGradient>
  <radialGradient id="blueGlow"><stop offset="0%" stop-color="#0EA5E9" stop-opacity=".38"/><stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
  <radialGradient id="violetGlow"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".34"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <radialGradient id="pinkGlow"><stop offset="0%" stop-color="#D946EF" stop-opacity=".25"/><stop offset="100%" stop-color="#D946EF" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tinyGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#6EA8FF" stroke-opacity=".07"/>
  </pattern>
  <clipPath id="clip"><rect width="1600" height="430" rx="28"/></clipPath>
  <style>
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin:center; }
    .pulse2 { animation: pulse 4.8s ease-in-out infinite .6s; transform-origin:center; }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out infinite 1.2s; }
    .scan { animation: scan 5.5s linear infinite; }
    .dash { animation: dash 7s linear infinite; }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.38; transform:scale(.94)} 50%{opacity:.82; transform:scale(1.08)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    @keyframes scan { 0%{transform:translateY(-80px);opacity:0} 12%{opacity:.55} 50%{opacity:.18} 100%{transform:translateY(500px);opacity:0} }
    @keyframes dash { to { stroke-dashoffset:-900; } }
    @keyframes blink { 0%,100%{opacity:.28} 50%{opacity:1} }
  </style>
</defs>

<g clip-path="url(#clip)">
  <rect width="1600" height="430" fill="url(#bg)"/>
  <rect width="1600" height="430" fill="url(#grid)"/>

  <ellipse cx="230" cy="90" rx="330" ry="210" fill="url(#blueGlow)" filter="url(#blur)" class="pulse"/>
  <ellipse cx="980" cy="140" rx="420" ry="260" fill="url(#violetGlow)" filter="url(#blur)" class="pulse2"/>
  <ellipse cx="1430" cy="330" rx="310" ry="220" fill="url(#pinkGlow)" filter="url(#blur)" class="pulse"/>

  <!-- Horizon / perspective lines -->
  <path d="M0 345 H1600" stroke="#6EA8FF" stroke-opacity=".12"/>
  <path d="M0 375 H1600" stroke="#6EA8FF" stroke-opacity=".08"/>
  <path d="M0 405 H1600" stroke="#6EA8FF" stroke-opacity=".06"/>
  <path d="M800 290 L1600 430 M800 290 L0 430" stroke="#7C3AED" stroke-opacity=".10"/>
  <path d="M800 290 L1220 430 M800 290 L380 430" stroke="#22D3EE" stroke-opacity=".08"/>

  <!-- Animated scan line -->
  <rect x="0" y="-90" width="1600" height="2" fill="url(#neon)" opacity=".32" class="scan"/>

  <!-- Left identity panel -->
  <rect x="54" y="48" width="720" height="286" rx="22" fill="#050A18" fill-opacity=".62" stroke="#3B82F6" stroke-opacity=".24"/>
  <rect x="54" y="48" width="6" height="286" rx="3" fill="url(#neon)"/>

  <text x="92" y="86" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">QUALITY ENGINEERING / DIGITAL PRODUCT DESIGN</text>
  <text x="92" y="158" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800">Mahdiyar</text>
  <text x="92" y="214" fill="url(#neon)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800">Namazifar</text>
  <text x="94" y="250" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">QA Engineer  ·  Manual &amp; Automation Testing  ·  UI/UX Designer</text>

  <!-- chips -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
    <rect x="92" y="274" width="154" height="32" rx="16" fill="#0EA5E9" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".55"/>
    <text x="169" y="295" text-anchor="middle" fill="#A5F3FC">PLAYWRIGHT</text>
    <rect x="258" y="274" width="130" height="32" rx="16" fill="#6366F1" fill-opacity=".10" stroke="#818CF8" stroke-opacity=".55"/>
    <text x="323" y="295" text-anchor="middle" fill="#C7D2FE">UI / UX</text>
    <rect x="400" y="274" width="146" height="32" rx="16" fill="#D946EF" fill-opacity=".08" stroke="#E879F9" stroke-opacity=".52"/>
    <text x="473" y="295" text-anchor="middle" fill="#F5D0FE">AI-ASSISTED</text>
  </g>

  <!-- Right holographic system -->
  <g class="float">
    <rect x="858" y="54" width="664" height="302" rx="26" fill="#071127" fill-opacity=".55" stroke="#5B8CFF" stroke-opacity=".25"/>
    <text x="894" y="90" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">QA CONTROL SURFACE // LIVE WORKFLOW</text>

    <!-- central flow -->
    <rect x="1044" y="116" width="230" height="82" rx="16" fill="#0B1730" stroke="#22D3EE" stroke-opacity=".42"/>
    <text x="1068" y="145" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">TEST EXECUTION</text>
    <text x="1068" y="171" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Observe → Verify → Improve</text>

    <!-- side nodes -->
    <g class="float2">
      <rect x="892" y="128" width="112" height="52" rx="13" fill="#0B1730" stroke="#3B82F6" stroke-opacity=".42"/>
      <text x="948" y="149" text-anchor="middle" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">MANUAL QA</text>
      <text x="948" y="166" text-anchor="middle" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Cases / Risk</text>

      <rect x="1310" y="128" width="166" height="52" rx="13" fill="#0B1730" stroke="#A855F7" stroke-opacity=".42"/>
      <text x="1393" y="149" text-anchor="middle" fill="#D8B4FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">PLAYWRIGHT</text>
      <text x="1393" y="166" text-anchor="middle" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">E2E Automation</text>
    </g>

    <!-- AI node -->
    <g class="pulse">
      <circle cx="1159" cy="250" r="45" fill="#7C3AED" fill-opacity=".10" stroke="url(#neon)" stroke-width="1.5"/>
      <circle cx="1159" cy="250" r="31" fill="#0B1730" stroke="#22D3EE" stroke-opacity=".55"/>
      <text x="1159" y="257" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">AI</text>
    </g>

    <!-- design node -->
    <rect x="892" y="220" width="184" height="72" rx="14" fill="#0B1730" stroke="#D946EF" stroke-opacity=".36"/>
    <text x="916" y="246" fill="#F0ABFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">UI / UX SYSTEMS</text>
    <text x="916" y="268" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Figma · Components · Motion</text>

    <!-- quality signal -->
    <rect x="1240" y="220" width="236" height="72" rx="14" fill="#0B1730" stroke="#6366F1" stroke-opacity=".38"/>
    <text x="1264" y="246" fill="#C7D2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">QUALITY SIGNALS</text>
    <text x="1264" y="268" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Bugs · Regression · UX · Risk</text>

    <!-- animated connections -->
    <path d="M1004 154 H1044 M1274 154 H1310 M1076 255 H1114 M1204 255 H1240" fill="none" stroke="url(#neon)" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 9" class="dash"/>
  </g>

  <!-- small status HUD -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="890" cy="334" r="4" fill="#22D3EE" class="blink"/>
    <text x="902" y="338" fill="#94A3B8" font-size="10" letter-spacing="1.4">SYSTEM READY</text>
    <text x="1320" y="338" fill="#64748B" font-size="10" letter-spacing="1.2">TEST / DESIGN / IMPROVE</text>
  </g>

  <!-- decorative particles -->
  <g fill="#67E8F9">
    <circle cx="818" cy="82" r="2" class="blink"/>
    <circle cx="1542" cy="106" r="2" class="blink"/>
    <circle cx="806" cy="318" r="2" class="blink"/>
    <circle cx="1494" cy="304" r="2" class="blink"/>
  </g>
  <path d="M18 18H92 M18 18V92 M1508 412H1582 M1582 338V412" stroke="url(#neon)" stroke-width="2" opacity=".7"/>
</g>
</svg>