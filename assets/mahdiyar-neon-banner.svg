<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Mahdiyar Namazifar — QA Engineer and UI/UX Designer</title>
  <desc id="desc">Animated futuristic neon profile banner for a QA Engineer, Playwright automation tester and UI/UX designer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#160b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#5ee7ff" stroke-opacity=".065"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .small{font-size:12px;letter-spacing:3px}
      .fade{animation:fade 3.6s ease-in-out infinite alternate}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .float{animation:float 5s ease-in-out infinite}
      .scan{animation:scan 4s linear infinite}
      .dash{stroke-dasharray:9 14;animation:dash 5s linear infinite}
      @keyframes fade{from{opacity:.35}to{opacity:1}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes scan{0%{transform:translateY(0);opacity:0}12%{opacity:.8}88%{opacity:.8}100%{transform:translateY(225px);opacity:0}}
      @keyframes dash{to{stroke-dashoffset:-115}}
    </style>
  </defs>

  <rect width="1600" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="430" rx="24" fill="url(#grid)"/>

  <ellipse cx="360" cy="130" rx="300" ry="230" fill="url(#glowBlue)" filter="url(#blur24)"/>
  <ellipse cx="1260" cy="180" rx="360" ry="260" fill="url(#glowPurple)" filter="url(#blur24)"/>

  <!-- futuristic horizon -->
  <path d="M0 360 C250 330 430 375 660 350 S1110 325 1600 350 V430 H0Z" fill="#02040b" opacity=".72"/>
  <path d="M0 350 C250 320 430 365 660 340 S1110 315 1600 340" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2" class="dash"/>

  <!-- left identity panel -->
  <g filter="url(#shadow)">
    <rect x="68" y="70" width="735" height="280" rx="22" fill="#07101f" fill-opacity=".72" stroke="#38bdf8" stroke-opacity=".24"/>
    <rect x="68" y="70" width="5" height="280" rx="2" fill="url(#accent)"/>
  </g>

  <text x="110" y="112" class="mono small fade" fill="#67e8f9">QA • DESIGN • AI • FUTURE</text>
  <text x="110" y="178" class="sans" font-size="50" font-weight="800" fill="#f8fafc">Mahdiyar</text>
  <text x="110" y="226" class="sans" font-size="50" font-weight="800" fill="url(#accent)">Namazifar</text>
  <text x="112" y="258" class="sans" font-size="17" fill="#cbd5e1">QA Engineer  ·  Manual &amp; Automation Testing  ·  UI/UX Designer</text>

  <!-- animated status chips -->
  <g class="float">
    <rect x="110" y="285" width="150" height="34" rx="17" fill="#0b1628" stroke="#22d3ee" stroke-opacity=".45"/>
    <circle cx="130" cy="302" r="5" fill="#22d3ee" class="pulse"/>
    <text x="144" y="307" class="mono" font-size="12" fill="#dffbff">PLAYWRIGHT</text>
  </g>
  <g class="float" style="animation-delay:-1.3s">
    <rect x="273" y="285" width="150" height="34" rx="17" fill="#0b1628" stroke="#818cf8" stroke-opacity=".45"/>
    <circle cx="293" cy="302" r="5" fill="#818cf8" class="pulse"/>
    <text x="307" y="307" class="mono" font-size="12" fill="#e0e7ff">UI / UX</text>
  </g>
  <g class="float" style="animation-delay:-2.4s">
    <rect x="436" y="285" width="150" height="34" rx="17" fill="#0b1628" stroke="#d946ef" stroke-opacity=".45"/>
    <circle cx="456" cy="302" r="5" fill="#d946ef" class="pulse"/>
    <text x="470" y="307" class="mono" font-size="12" fill="#fae8ff">AI-ASSISTED</text>
  </g>

  <!-- right futuristic QA/design HUD -->
  <g transform="translate(865 55)" filter="url(#shadow)">
    <rect x="0" y="0" width="650" height="315" rx="22" fill="#050b18" fill-opacity=".78" stroke="#818cf8" stroke-opacity=".32"/>
    <text x="28" y="34" class="mono" font-size="12" fill="#93c5fd">QUALITY CONTROL // LIVE WORKFLOW</text>

    <rect x="28" y="58" width="275" height="104" rx="14" fill="#091326" stroke="#22d3ee" stroke-opacity=".24"/>
    <text x="48" y="84" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Test Execution</text>
    <text x="48" y="112" class="mono" font-size="11" fill="#94a3b8">UI • API • REGRESSION</text>
    <circle cx="72" cy="137" r="13" fill="#22c55e" fill-opacity=".18" stroke="#22c55e"/>
    <path d="M66 137l5 5 9-11" fill="none" stroke="#4ade80" stroke-width="2"/>
    <text x="98" y="142" class="mono" font-size="13" fill="#86efac">PASSING</text>
    <text x="235" y="143" class="mono" font-size="22" font-weight="700" fill="#67e8f9">98%</text>

    <rect x="322" y="58" width="300" height="104" rx="14" fill="#091326" stroke="#a855f7" stroke-opacity=".28"/>
    <text x="342" y="84" class="sans" font-size="15" font-weight="700" fill="#f8fafc">AI QA Assistant</text>
    <text x="342" y="112" class="mono" font-size="11" fill="#94a3b8">ANALYZE • GENERATE • IMPROVE</text>
    <path d="M344 137 C380 113 416 159 451 132 S520 112 590 139" fill="none" stroke="url(#accent)" stroke-width="3" class="dash"/>
    <circle cx="588" cy="137" r="7" fill="#d946ef" class="pulse"/>

    <rect x="28" y="181" width="594" height="104" rx="14" fill="#07101f" stroke="#6366f1" stroke-opacity=".22"/>
    <text x="48" y="208" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Design → Test → Learn → Improve</text>
    <g class="mono" font-size="11" fill="#94a3b8">
      <text x="48" y="237">Figma / UI Systems</text>
      <text x="205" y="237">→</text>
      <text x="232" y="237">Playwright</text>
      <text x="340" y="237">→</text>
      <text x="367" y="237">Quality Signals</text>
      <text x="510" y="237">→</text>
      <text x="537" y="237">AI Insights</text>
    </g>
    <path d="M48 258 H598" stroke="#334155"/>
    <path d="M48 258 H390" stroke="url(#accent)" stroke-width="3" class="dash"/>
  </g>

  <!-- scanning beam -->
  <rect x="885" y="75" width="610" height="3" fill="#67e8f9" opacity=".0" class="scan" filter="url(#blur8)"/>
  <rect x="885" y="75" width="610" height="1.5" fill="#67e8f9" opacity=".0" class="scan"/>

  <!-- corner ornaments -->
  <path d="M24 24h95M24 24v95M1576 406h-95M1576 406v-95" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
  <circle cx="1540" cy="55" r="4" fill="#22d3ee" class="pulse"/>
  <circle cx="1520" cy="55" r="4" fill="#a855f7" class="pulse" style="animation-delay:-.8s"/>
</svg>